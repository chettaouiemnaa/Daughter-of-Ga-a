        <h1 style="font-weight:400;">Daughter of Gaïa — lieu événementiel privé à Tunis</h1>

        <p>Daughter of Gaïa est un domaine privé de 4 000 m² situé à La Soukra, dans le gouvernorat de l'Ariana, aux portes de Tunis. Un lieu événementiel où les réceptions s'intègrent à la nature plutôt que l'inverse, et où vivent des chevaux recueillis et réhabilités.</p>

        <h2 style="font-weight:400;">Un domaine entièrement privatisé</h2>
        <p>Contrairement aux salles des fêtes classiques, le domaine est réservé à un seul événement à la fois. Vous êtes les seuls sur place, jusqu'à 80 invités, avec 40 places de parking à l'entrée, une cuisine entièrement équipée, une terrasse tournée vers le jardin et un espace couvert en matériaux naturels.</p>

        <h2 style="font-weight:400;">Les événements accueillis</h2>
        <p>Séminaires et journées d'équipe, lancements de produits et de marques, anniversaires, baby showers, brunchs privés, tables d'hôtes, événements pour enfants, shootings photo et vidéo, tournages de films. Les formats en journée sont privilégiés, afin de préserver la tranquillité des animaux et du voisinage.</p>

        <h2 style="font-weight:400;">Un lieu de tournage près de Tunis</h2>
        <p>Le domaine propose cinq décors extérieurs, une maison entièrement filmable et de la lumière naturelle toute la journée, à vingt minutes du centre de Tunis. Des chevaux vivent sur place et entrent naturellement dans le cadre, sans transport ni prestataire extérieur.</p>

        <h2 style="font-weight:400;">Un refuge avant d'être un lieu de réception</h2>
        <p>Sept chevaux ont été recueillis depuis l'ouverture ; quatre vivent ici aujourd'hui. Ils ne sont ni une attraction ni une animation : ils évoluent à leur rythme, observables à distance, et leur bien-être passe avant l'événement. Chaque réservation contribue directement à leur entretien.</p>

        <h2 style="font-weight:400;">Questions fréquentes</h2>

        <p>Non. Daughter of Gaïa accueille uniquement des événements privés, sur réservation. Chaque réservation privatise entièrement le domaine, et vous êtes les seuls sur place.</p>

        <h3 style="font-weight:400;">Combien de personnes le lieu peut-il accueillir ?</h3>
        <p>Jusqu'à 80 invités, avec un parking de 40 places à l'entrée. Le nombre idéal dépend du format de votre événement et des espaces mobilisés.</p>

        <h3 style="font-weight:400;">Où se trouve le domaine ?</h3>
        <p>Au 64 avenue Fattouma Bourguiba, à La Soukra, dans le gouvernorat de l'Ariana, à une vingtaine de minutes du centre de Tunis.</p>

        <h3 style="font-weight:400;">Peut-on approcher les animaux ?</h3>
        <p>Les animaux vivent chez eux et ne sont pas une attraction. Ils sont observables à distance, dans le respect de leur tranquillité. Aucune interaction n'est organisée.</p>

        <h3 style="font-weight:400;">Pourquoi privilégier les événements en journée ?</h3>
        <p>Pour préserver le calme des animaux et le repos du voisinage. Les formats en journée sont donc favorisés.</p>
